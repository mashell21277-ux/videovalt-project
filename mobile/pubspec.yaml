name: video_vault
description: VideoVault - Watch, download, and browse videos offline.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  provider: ^6.1.5
  go_router: ^15.1.2
  video_player: ^2.9.5
  chewie: ^1.11.3
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  file_picker: ^10.1.9
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
